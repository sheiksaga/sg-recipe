name: Validate recipes

on:
  pull_request:
    paths:
      - 'recipes/**'
      - 'schema/**'
      - 'data/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate-recipes.ts
